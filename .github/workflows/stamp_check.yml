name: Japan Post Stamp Bot

on:
  schedule:
    - cron: "0 23 * * *"  # UTC 23:00 = JST 08:00
    - cron: "0 3 * * *"   # UTC 03:00 = JST 12:00
    - cron: "0 13 * * *"  # UTC 13:00 = JST 22:00
  workflow_dispatch:

jobs:
  check-stamps:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install requests beautifulsoup4

      - name: 新着風景印を確認してNotionに登録
        run: python japan_post_stamp_bot.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      - name: 確認済みIDをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_stamps.json
          git diff --staged --quiet || git commit -m "chore: update seen stamps cache"
          git push
